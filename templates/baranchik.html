<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Шаблон — Баранчик (Кудряш в очках)</title>
  <style>
    @page { size: A4 portrait; margin: 15mm; }
    body { font-family: 'Comic Sans MS', 'Arial', sans-serif; text-align: center; color: #1e293b; padding: 20px; }
    .header { border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 15px; }
    h1 { font-size: 26px; margin: 0 0 6px; color: #4338ca; }
    p { font-size: 15px; color: #64748b; margin: 0; }
    .instruction { font-size: 16px; margin: 12px 0 20px; color: #0284c7; font-weight: bold; }
    .canvas-box {
      width: 440px;
      height: 440px;
      margin: 15px auto;
      border: 3px dashed #94a3b8;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #fafafa;
    }
    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #0f172a;
      border-style: solid;
    }
    .c-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
    .c-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
    .c-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
    .c-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }
    .footer {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>«Оживлятор»</h1>
    <p>Шаблон для детского рисунка • Баранчик</p>
  </div>
  <div class="instruction">
    Инструкция: обведите кудряшки-иголки, нарисуйте круглые очки, улыбку, ручки и ножки!
  </div>

  <div class="canvas-box">
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>
    <svg width="380" height="380" viewBox="0 0 100 100">
      <!-- Контур пышной шерстки-звездочки -->
      <polygon points="50,6 59,20 72,13 74,27 88,27 82,40 94,48 83,58 90,72 76,73 74,87 61,81 50,92 39,81 26,87 24,73 10,72 17,58 6,48 18,40 12,27 26,27 28,13 41,20" 
               fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
      <!-- Направляющие для очков -->
      <circle cx="36" cy="48" r="11" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2"/>
      <circle cx="64" cy="48" r="11" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2"/>
      <line x1="47" y1="48" x2="53" y2="48" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2"/>
      <!-- Улыбка -->
      <path d="M 40,66 Q 50,74 60,66" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2"/>
    </svg>
  </div>

  <div class="footer">
    <div>Имя юного мультипликатора: ______________________</div>
    <div>«Оживлятор» 2026 • Все права защищены</div>
  </div>
</body>
</html>
